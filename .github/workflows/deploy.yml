# Deploy a producción: cada push a `master` que toque código publica el juego en
# Cloudflare (https://mamones-con-mamones.sergebruni.workers.dev).
#
# Es UN solo Worker: sirve la sala (Durable Object SalaDO), el API/auth y los
# assets estáticos del cliente (wrangler.jsonc → assets.directory: ./dist). Por
# eso el orden importa: el cliente se buildea ANTES de `wrangler deploy` y las
# migraciones D1 se aplican ANTES de publicar (si fallan, no se despliega nada).
# Ese orden vive en el script `deploy` de package.json, no aquí, para que el
# deploy manual (`bun run deploy`) haga exactamente lo mismo que la CI.
#
# ⚠️ Hasta que existan los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID
# en el repo, este workflow solo corre los tests y se salta el deploy con un
# aviso (así los pushes no quedan en rojo durante la migración). Al configurar
# los secrets, el deploy se activa solo. Token recomendado: plantilla "Edit
# Cloudflare Workers" + permiso de cuenta D1:Edit.
name: Deploy

on:
  push:
    branches: [master]
    # Un push solo de docs no necesita redeploy. Si un push mezcla docs y
    # código, paths-ignore no aplica y el deploy corre igual (que es lo que
    # queremos).
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Un deploy a la vez. `cancel-in-progress: false` a propósito: abortar un
# deploy a medias es peor que esperar a que termine el anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verificar y desplegar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: produccion
      url: https://mamones-con-mamones.sergebruni.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # La verificación corre ANTES del deploy: si algo está roto, no se publica.
      - name: Tests (motor de reglas + Worker/SalaDO en workerd)
        run: bun run test

      - name: Build + migraciones D1 + deploy del Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run deploy

      - name: Deploy omitido (faltan secrets)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN no está configurado — solo corrieron los tests."
          echo "Para activar el deploy: Settings → Secrets and variables → Actions →"
          echo "añadir CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID."
